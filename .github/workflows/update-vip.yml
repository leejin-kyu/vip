name: VIP 강의 페이지 자동 갱신

on:
  schedule:
    - cron: "17 * * * *"   # 1시간마다 (UTC 기준 매시 17분)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site.config.json"
      - "scripts/**"

permissions:
  contents: write
  pages: write

concurrency:
  group: vip-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 인프런·유튜브 수치 가져와서 index.html 다시 만들기
        run: node scripts/build.mjs

      - name: 바뀐 내용이 있으면 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/snapshot.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            git commit -m "chore: 인프런 강의 데이터 자동 반영"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Pages 다시 배포 요청
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
